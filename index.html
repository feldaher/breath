<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Breath</title>
  </head>
  <body>
    <canvas id="view"></canvas>
    <div id="hud">
      <h1>Breath</h1>
      <p class="sub">An alveolar sac you can infect. Eight alveoli, 936 cells, 240 macrophages.</p>

      <div class="seg" id="views">
        <button data-view="alveoli" aria-pressed="true">Alveoli</button>
        <button data-view="cells">Cells</button>
        <button data-view="virions">Virions</button>
      </div>

      <div id="stats"></div>
      <canvas id="plot" width="300" height="78"></canvas>
      <div id="legend"></div>

      <div class="row">
        <button id="infect">Infect</button>
        <button id="antiviral">Antiviral</button>
        <button id="ifn">Interferon</button>
      </div>
      <div class="row">
        <button id="pause">Pause</button>
        <button id="slow">1× speed</button>
        <button id="reset">Reset</button>
      </div>
      <p class="note" id="about"></p>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
